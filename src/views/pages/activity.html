<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity · Knowledge Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="core-app kh-app">
    <header class="navbar core-topbar" data-kh-header data-section="Activity"></header>

    <main class="core-main">
        <div class="core-page-header">
            <div>
                <h1 class="core-page-title">Activity</h1>
                <p class="core-page-subtitle">What has happened in the library, newest first.</p>
            </div>
            <div class="btn-group" role="group" aria-label="Show">
                <input type="radio" class="btn-check" name="scope" id="scopeAll" value="all" checked>
                <label class="btn btn-outline-secondary" for="scopeAll">Everyone</label>
                <input type="radio" class="btn-check" name="scope" id="scopeMine" value="mine">
                <label class="btn btn-outline-secondary" for="scopeMine">Mine</label>
            </div>
        </div>

        <div class="alert fade" role="alert" id="pageAlert"></div>

        <div class="card">
            <ul class="list-group list-group-flush" id="activityList" aria-live="polite"></ul>
        </div>
    </main>
</div>

<script src="/js/shell.js"></script>
<script src="/js/activity.js"></script>
</body>
</html>
