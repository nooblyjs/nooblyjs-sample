<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library · Knowledge Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <link rel="stylesheet" href="/services/css/core.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="core-app kh-app">
    <header class="navbar core-topbar">
        <a class="core-brand" href="/library">
            <span class="kh-logo" aria-hidden="true"><i class="bi bi-journal-text"></i></span>
            <span class="name"><span data-app-name>Knowledge Hub</span><small>Library</small></span>
        </a>
        <div class="core-topbar-actions">
            <a href="/services/" class="core-icon-btn d-none" data-admin-only title="Service dashboards">
                <i class="bi bi-grid-3x3-gap"></i>
            </a>
            <div class="core-user">
                <span class="kh-user-name" data-user-name></span>
                <div class="av" data-user-initials></div>
            </div>
            <button type="button" class="core-icon-btn" data-logout title="Sign out">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </header>

    <main class="core-main">
        <div class="core-page-header">
            <div>
                <h1 class="core-page-title">Library</h1>
                <p class="core-page-subtitle" id="librarySummary">Loading documents…</p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="bi bi-upload"></i> Upload
            </button>
        </div>

        <div class="alert fade" role="alert" id="pageAlert"></div>

        <form class="card mb-3" id="filters" role="search">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="filterQ">Title contains</label>
                        <input type="search" class="form-control" id="filterQ" maxlength="200" placeholder="e.g. runbook">
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label" for="filterTag">Tag</label>
                        <select class="form-select" id="filterTag"><option value="">All tags</option></select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="filterOwner">Owner</label>
                        <select class="form-select" id="filterOwner">
                            <option value="">Everyone</option>
                            <option value="me">Mine</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="filterStatus">Status</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Any</option>
                            <option value="queued">Queued</option>
                            <option value="processing">Processing</option>
                            <option value="ready">Ready</option>
                            <option value="failed">Failed</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-1 d-grid">
                        <button type="reset" class="btn btn-outline-secondary" title="Clear filters">Clear</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="card">
            <ul class="list-group list-group-flush" id="documentList" aria-live="polite"></ul>
            <div class="card-body text-center d-none" id="emptyState">
                <i class="bi bi-inbox fs-2 text-muted"></i>
                <p class="mb-0 text-muted">No documents match these filters.</p>
            </div>
        </div>
        <div class="text-center mt-3">
            <button type="button" class="btn btn-outline-secondary d-none" id="loadMore">Load more</button>
        </div>
    </main>
</div>

<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="uploadForm" novalidate>
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="uploadModalLabel">Upload a document</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert fade" role="alert" id="uploadAlert"></div>
                <div class="mb-3">
                    <label class="form-label" for="uploadFile">File</label>
                    <input class="form-control" type="file" id="uploadFile" name="file" required>
                    <div class="form-text" id="uploadHint"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="uploadTitle">Title <span class="text-muted">(optional)</span></label>
                    <input class="form-control" type="text" id="uploadTitle" name="title" maxlength="200" placeholder="Defaults to the file name">
                </div>
                <div>
                    <label class="form-label" for="uploadTags">Tags <span class="text-muted">(optional)</span></label>
                    <input class="form-control" type="text" id="uploadTags" name="tags" placeholder="onboarding, guide">
                    <div class="form-text">Comma-separated. Letters, numbers and hyphens.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="uploadSubmit">Upload</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/library.js"></script>
</body>
</html>
